name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # weekly, to pick up new Wiktionary and Tatoeba data
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Week number (source cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: data_cache
          key: sources-${{ steps.week.outputs.week }}

      - name: Test data pipeline
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build dictionary data
        run: python3 scripts/build_data.py

      - run: npm ci
      - run: npm test
      - run: npm run check

      - name: Build site
        run: npm run build
        env:
          # Project sites are served from /<repo>/. Use '/' for a custom domain or a user site.
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
