name: Build and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1' # weekly, to pick up new Wiktionary and Tatoeba data
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Week number (source cache key)
        id: week
        run: echo "week=$(date -u +%G-%V)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: data_cache
          key: sources-${{ steps.week.outputs.week }}

      - name: Test data pipeline
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Build dictionary data
        run: python3 scripts/build_data.py

      # The Android app reads the SQLite database; the website reads the JSON. They must agree.
      - name: Check the database matches the JSON
        run: python3 scripts/check_db.py

      - run: npm ci
      - run: npm test
      - run: npm run check

      # The web search's results for scripts/fixtures/parity_queries.json, for the Android parity test.
      - name: Golden search results
        run: npx vitest run --config vitest.golden.config.ts

      - uses: actions/upload-artifact@v7
        with:
          name: android-data
          path: |
            public/data/manifest.json
            public/data/*/szokert.db.xz
            android/build/golden.json
          retention-days: 7

      # Assets use relative URLs, so the build works on the custom domain and under /<repo>/ alike.
      - name: Build site
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: dist
          retention-days: 7

  # The Android app (android/). Separate from the site, so an app failure never blocks a deploy.
  android:
    needs: build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v6

      # This build's database and golden results, so the parity test runs on the same data.
      - uses: actions/download-artifact@v8
        with:
          name: android-data
          path: .

      - name: Test and build the debug APK
        run: ./gradlew check assembleDebug

      # Signed with CI's own debug key, which changes per run: for testing, not for keeping.
      - uses: actions/upload-artifact@v7
        with:
          name: szokert-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  # Cloudflare Worker serving dist/ as static assets (wrangler.jsonc).
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: dist

      - name: Deploy to Cloudflare
        run: npx --yes wrangler@4.147.0 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
